# Katalog hospod celé ČR pro appku (název, typ, poloha, adresa, otvíračka, pivovar, web, telefon) z OpenStreetMap.
# Jednou týdně stáhne výřez ČR z Geofabriku (spolehlivější než velký dotaz na Overpass – ten vrací 504),
# vybere pub/bar/biergarten/restaurant, zabalí do hospody-cz.csv.gz a nahraje k vydání „katalog“
# (pre-release, appka ho nebere jako aktualizaci).
# Ručně: GitHub → Actions → Katalog hospod → Run workflow.
# Data © přispěvatelé OpenStreetMap (ODbL).
name: Katalog hospod

on:
  schedule:
    - cron: '17 3 * * 1'   # pondělí 3:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  katalog:
    runs-on: ubuntu-latest
    steps:
      - name: Nástroje
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Stáhnout ČR z Geofabriku
        run: |
          curl -sS --fail --retry 3 --retry-delay 30 -L \
            -o cz.osm.pbf https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf
          ls -l cz.osm.pbf

      - name: Vybrat hospody
        run: |
          osmium tags-filter cz.osm.pbf nwr/amenity=pub,bar,biergarten,restaurant -o hospody.osm.pbf --overwrite
          osmium export hospody.osm.pbf -f geojsonseq --add-unique-id=type_id \
            --format-option=print_record_separator=false -o hospody.geojsonseq --overwrite
          python3 - <<'PY'
          import json
          kinds = {"pub", "bar", "biergarten", "restaurant"}
          # stejné sloupce jako Overpass dotaz v appce (PubCatalog.Columns → Parse)
          extra = ["addr:street", "addr:place", "addr:housenumber", "addr:conscriptionnumber", "addr:city",
                   "brewery", "opening_hours", "website", "contact:website", "phone", "contact:phone"]
          types = {"n": "node", "w": "way", "r": "relation"}

          def points(g):
              t, c = g["type"], g["coordinates"]
              if t == "Point": yield c
              elif t in ("LineString", "MultiPoint"): yield from c
              elif t in ("Polygon", "MultiLineString"):
                  for ring in c: yield from ring
              elif t == "MultiPolygon":
                  for poly in c:
                      for ring in poly: yield from ring

          def clean(s):
              return " ".join(str(s).replace("\t", " ").split())

          seen, rows = set(), []
          with open("hospody.geojsonseq", encoding="utf-8") as f:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  o = json.loads(line)
                  p = o.get("properties") or {}
                  name, kind = clean(p.get("name", "")), p.get("amenity", "")
                  fid = str(o.get("id", ""))
                  if not name or kind not in kinds or len(fid) < 2 or fid[0] not in types or fid in seen: continue
                  pts = list(points(o["geometry"]))
                  if not pts: continue
                  # střed obdélníku (jako „out center“ v Overpassu)
                  lon = (min(x for x, _ in pts) + max(x for x, _ in pts)) / 2
                  lat = (min(y for _, y in pts) + max(y for _, y in pts)) / 2
                  seen.add(fid)
                  cols = [types[fid[0]], fid[1:], f"{lat:.6f}", f"{lon:.6f}", name, kind] + [clean(p.get(k, "")) for k in extra]
                  rows.append("\t".join(cols))

          if len(rows) < 10000:
              raise SystemExit(f"Podezřele málo podniků: {len(rows)}")
          with open("hospody.csv", "w", encoding="utf-8", newline="\n") as f:
              f.write("\t".join(["@type", "@id", "@lat", "@lon", "name", "amenity"] + extra) + "\n")
              f.write("\n".join(rows) + "\n")
          print(f"Podniků: {len(rows)}")
          PY
          gzip -9 -n -c hospody.csv > hospody-cz.csv.gz
          ls -l hospody.csv hospody-cz.csv.gz
          head -3 hospody.csv

      - name: Nahrát k vydání „katalog“
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view katalog > /dev/null 2>&1; then
            gh release create katalog --prerelease --latest=false \
              --title "Katalog hospod (automaticky)" \
              --notes "Seznam hospod z OpenStreetMap pro appku – obnovuje se sám jednou týdně, nemazat. Data © přispěvatelé OpenStreetMap (ODbL)."
          fi
          gh release upload katalog hospody-cz.csv.gz --clobber
