# Webová verze Dezolátů (hlavně pro iPhone) → GitHub Pages: https://el-pietro.github.io/Dezolati/
# Spustí se sama po pushi do master, když se změní web nebo sdílená logika (Services, Models).
# Jednorázově v repu: Settings → Pages → Source: GitHub Actions.
name: Web

on:
  push:
    branches: [master]
    paths:
      - 'Dezolati.Web/**'
      - 'Services/**'
      - 'Models/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sestavit web
        run: dotnet publish Dezolati.Web/Dezolati.Web.csproj -c Release -o out

      - name: Úpravy pro GitHub Pages
        run: |
          # odkazy typu /Dezolati/statistiky → GitHub vrátí 404.html = appka si stránku najde sama
          cp out/wwwroot/index.html out/wwwroot/404.html
          # bez tohohle GitHub schová složku _framework
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
